name: ESLint Check

on:
    pull_request:
        branches: ['main', 'dev']

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Prettier formatting
              run: npm run format

            - name: Check Prettier formatting
              run: npm run format:check

            - name: Run ESLint
              run: npm run lint
